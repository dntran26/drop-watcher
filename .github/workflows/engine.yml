name: engine

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Never run two checks at once; a slow run just delays the next.
concurrency:
  group: engine
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Watch Tower
        run: npm run watch
      - name: Pokemon drops
        if: always()
        run: npm run drops
